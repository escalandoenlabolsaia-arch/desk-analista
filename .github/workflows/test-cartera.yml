name: test-cartera

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar lectura de cartera
        env:
          SHEET_ID_HIJO: ${{ secrets.SHEET_ID_HIJO }}
          GSA_JSON_HIJO: ${{ secrets.GSA_JSON_HIJO }}
        run: python cartera.py
